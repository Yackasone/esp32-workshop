# Open a pull request that adds or changes teams/<you>.cpp, and every push to it flashes
# your board on the instructor's laptop (a self-hosted runner with the boards plugged in).
# The board's serial output is at the bottom of the run's log.
#
# SECURITY (public repo + self-hosted runner): pull requests use `pull_request_target`, so
# this workflow and all tooling (ws, CMake, workshop.h) always come from main, never from the
# pull request. Only the PR's teams/*.cpp files are taken, and they compile inside a
# bubblewrap sandbox (WS_SANDBOX=1) that can't see the laptop's files or the network.
# Never add a `pull_request` trigger or check out the PR's head here.
name: Flash my board

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["teams/*.cpp"]
  push:
    branches: [main]
    paths: ["teams/*.cpp"]
  workflow_dispatch:
    inputs:
      sketch:
        description: "Team or example name (e.g. rockets or 00_hello), or 'prewarm' to build everything once"
        required: true
      board:
        description: "Board number (blank = the // board: line in the file)"
        required: false

permissions:
  contents: read

env:
  WS_SANDBOX: "1"
  GIT_TERMINAL_PROMPT: "0"   # never hang on a password prompt

# No `concurrency:` on purpose: it cancels queued runs. The single runner already runs
# jobs one at a time, and ws's lock guards the boards.
jobs:
  flash:
    runs-on: [self-hosted, esp32-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4   # main's code, also for pull requests
        with:
          clean: false        # keep build/ so builds take seconds, not minutes
          fetch-depth: 0
          persist-credentials: false
      - name: Build and flash (pull request)
        if: github.event_name == 'pull_request_target'
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Public repo: anonymous fetch, so no token sits in .git/config where sandboxed code can read it.
          timeout 120 git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/$PR"
          ./ws ci-pr "$BASE" "$HEAD"
      - name: Build and flash (push to main)
        if: github.event_name == 'push'
        run: ./ws ci "${{ github.event.before }}" "${{ github.sha }}"
      - name: Build and flash (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SKETCH: ${{ inputs.sketch }}
          BOARD: ${{ inputs.board }}
        run: |
          if [ "$SKETCH" = prewarm ]; then ./ws prewarm esp32 esp32s3 esp32c6; exit; fi
          ./ws flash "$SKETCH" $BOARD
          ./ws capture $BOARD
